name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    # ubuntu-latest provides Docker, which the API tests use to start PostgreSQL (Testcontainers).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CrewCall.sln

      - name: Build
        run: dotnet build CrewCall.sln --no-restore

      # global.json opts into Microsoft.Testing.Platform, where the solution is passed with --solution.
      - name: Test
        run: dotnet test --solution CrewCall.sln --no-build
